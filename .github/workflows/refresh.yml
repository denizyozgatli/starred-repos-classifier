name: Refresh and Deploy Starred Repositories

on:
  schedule:
    # Daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages-deploy'
  cancel-in-progress: false

jobs:
  refresh-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run data pipeline (fetch, classify, overrides, validate)
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run pipeline:run

      - name: Validate dataset
        run: npm run pipeline:validate

      - name: Run test suite
        run: npm test

      - name: Build static site
        run: npm run build

      - name: Commit and push changes if updated
        run: |
          # Ensure git has the latest remote state
          git fetch origin master

          # Stash newly generated repos.json in a temporary location outside git
          TEMP_REPOS="$(mktemp)"
          cp data/repos.json "$TEMP_REPOS"

          # Synchronize local branch to latest origin/master
          git checkout -B master origin/master

          # Restore newly generated repos.json
          cp "$TEMP_REPOS" data/repos.json
          rm -f "$TEMP_REPOS"

          # Check if data/repos.json has changes against latest origin/master
          if git diff --exit-code data/repos.json > /dev/null; then
            echo "No changes detected in data/repos.json against origin/master."
          else
            echo "Changes detected in data/repos.json. Committing and pushing..."
            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"
            git add data/repos.json
            git commit -m "chore(data): refresh starred repositories dataset [skip ci]"
            git push origin master
          fi

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    needs: refresh-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
