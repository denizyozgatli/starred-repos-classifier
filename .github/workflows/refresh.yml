name: Refresh Starred Repositories

on:
  schedule:
    # Daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'refresh-and-deploy'
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run data pipeline (fetch, classify, overrides, validate)
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run pipeline:run

      - name: Validate dataset
        run: npm run pipeline:validate

      - name: Run test suite
        run: npm test

      - name: Build static site
        run: npm run build

      - name: Check for dataset changes
        id: git_diff
        run: |
          git status --porcelain
          if git diff --exit-code data/repos.json > /dev/null; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes detected in data/repos.json."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected in data/repos.json."
          fi

      - name: Commit and push changes if updated
        if: steps.git_diff.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/repos.json
          git commit -m "chore(data): refresh starred repositories dataset [skip ci]"
          git push
